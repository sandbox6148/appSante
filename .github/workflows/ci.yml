name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specs:
    name: Cohérence des specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-specs.mjs

  app:
    name: Application (lint, types, tests, build, parcours)
    runs-on: ubuntu-latest
    needs: specs
    # Le socle applicatif est créé à l'itération 0 (/fondations) ; tant qu'il n'existe pas, ce job est sauté.
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Navigateurs Playwright (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Captures et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
